<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dumbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #0c0c0c;
  --bg-panel: #141414;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.1);
  --text-1: rgba(255,255,255,0.92);
  --text-2: rgba(255,255,255,0.55);
  --text-3: rgba(255,255,255,0.3);
  --text-4: rgba(255,255,255,0.15);
  --accent-h: 36; --accent-s: 96%; --accent-l: 60%;
  --accent: hsl(var(--accent-h), var(--accent-s), var(--accent-l));
  --terminal-width: 540px;
  --terminal-padding: 64px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

html { height: 100%; }

body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-deep);
  color: var(--text-2);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.25); }

.app {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr auto;
  height: 100vh;
  animation: fadeIn 0.5s var(--ease-out);
}
@keyframes fadeIn { from { opacity: 0 } }

/* ─── Editor ────────────────────────────────────────────────── */
.editor-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.panel-hdr {
  padding: 0 20px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-hdr span:first-child {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.panel-hdr .hint {
  font-size: 10px;
  color: var(--text-4);
  font-weight: 500;
}

#editor {
  flex: 1;
  resize: none;
  background: var(--bg-deep);
  color: rgba(255,255,255,0.8);
  border: none;
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.75;
  font-feature-settings: 'liga' 1;
  outline: none;
  tab-size: 2;
  overflow-y: auto;
  caret-color: var(--accent);
}
#editor::placeholder { color: rgba(255,255,255,0.1); }

/* ─── Preview ───────────────────────────────────────────────── */
.preview-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-deep);
}

.preview-scroll {
  flex: 1;
  overflow: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse 60% 50% at 50% 45%, rgba(255,255,255,0.018) 0%, transparent 70%),
    var(--bg-deep);
}
.preview-scroll.checker {
  background:
    radial-gradient(ellipse 60% 50% at 50% 45%, rgba(255,255,255,0.015) 0%, transparent 70%),
    repeating-conic-gradient(rgba(255,255,255,0.03) 0% 25%, transparent 0% 50%) 0 0 / 14px 14px,
    var(--bg-deep);
}

/* ─── Export Frame ──────────────────────────────────────────── */
.export-frame {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-radius: 16px;
  transition: background 0.5s var(--ease-out), padding 0.4s var(--ease-out);
}
.export-frame.has-bg { padding: var(--terminal-padding); }
.export-frame:not(.has-bg) { padding: 0; }

/* ─── Terminal ──────────────────────────────────────────────── */
.terminal {
  width: var(--terminal-width);
  max-width: 100%;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  transition: width 0.3s var(--ease-out), background 0.4s, box-shadow 0.4s;
}

.terminal-chrome {
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  position: relative;
}

.chrome-dots { display: flex; gap: 8px; }
.chrome-dots span {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transition: background 0.2s;
}

.terminal:hover .chrome-dots span:nth-child(1) { background: #ff5f57; }
.terminal:hover .chrome-dots span:nth-child(2) { background: #febc2e; }
.terminal:hover .chrome-dots span:nth-child(3) { background: #28c840; }

.chrome-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 600;
  user-select: none;
  letter-spacing: -0.01em;
  transition: color 0.3s;
}

.terminal-body {
  padding: 2px 22px 26px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.75;
  font-feature-settings: 'liga' 1;
  min-height: 40px;
  transition: color 0.3s;
}

.terminal-body .empty-state { color: rgba(255,255,255,0.12); font-style: italic; font-size: 12px; padding: 16px 0; }

/* ─── Turns ─────────────────────────────────────────────────── */
.turn { padding: 3px 8px; margin: 0 -8px; border-radius: 6px; cursor: default; transition: background 0.15s; }
.turn:hover { background: rgba(255,255,255,0.025); }
.turn-number { font-size: 9px; font-weight: 500; opacity: 0.18; margin-right: 8px; font-variant-numeric: tabular-nums; user-select: none; display: inline-block; min-width: 13px; text-align: right; }
.turn-number.hidden { display: none; }
.turn-user .prompt-char { font-weight: 700; margin-right: 2px; }
.turn-user .user-text { font-weight: 600; }
.turn-ai { opacity: 0.75; }
.turn-ai .ai-prefix { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 8px; opacity: 0.7; }
.turn-ai .continuation { display: block; padding-left: 20px; position: relative; }
.turn-ai .continuation::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 1.5px; border-radius: 1px; background: currentColor; opacity: 0.1; }
/* Prompt bar style (Codex) — full row highlight on user input */
.turn-user.prompt-bar { background: rgba(255,255,255,0.06); border-radius: 4px; padding: 5px 10px; margin: 2px -10px; }
/* Prompt accent style (Claude) — left accent border + subtle bg */
.turn-user.prompt-accent { border-left: 3px solid var(--accent-border, rgba(255,255,255,0.4)); padding-left: 10px; margin-left: -13px; background: rgba(255,255,255,0.03); border-radius: 0 4px 4px 0; padding-top: 4px; padding-bottom: 4px; }
/* Bullet prefix */
.ai-bullet { font-weight: 700; margin-right: 8px; opacity: 0.85; font-size: 13px; line-height: 1; }
/* Inline highlights for CLI tokens */
.hl-cmd { opacity: 1; } /* /commands, paths — colored via JS */
.hl-num { opacity: 1; } /* list numbers like 1. 2. */
/* Continuation variants */
.turn-ai.cont-none .continuation { display: block; padding-left: 0; }
.turn-ai.cont-none .continuation::before { display: none; }
.turn-ai.cont-indent .continuation { display: block; padding-left: 20px; }
.turn-ai.cont-indent .continuation::before { display: none; }
.ai-para-gap { height: 10px; }
.turn-gap { height: 14px; }
.cursor-blink::after { content: '\2588'; animation: blink 1.1s step-end infinite; margin-left: 2px; font-weight: 400; opacity: 0.6; }
@keyframes blink { 0%,100% { opacity: 0.6 } 50% { opacity: 0 } }

/* Resize handles */
.resize-handle { position: absolute; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); cursor: ew-resize; z-index: 10; opacity: 0; transition: opacity 0.25s, transform 0.25s var(--ease-spring); }
.export-frame:hover .resize-handle { opacity: 1; }
.resize-handle:hover { transform: translateY(-50%) scale(1.5); }
.resize-handle.left { left: calc(var(--terminal-padding) / 2 - 3px); }
.resize-handle.right { right: calc(var(--terminal-padding) / 2 - 3px); }
.export-frame:not(.has-bg) .resize-handle { display: none; }

/* Drag */
.turn[draggable="true"] { position: relative; }
.turn.dragging { opacity: 0.25; }
.turn.drag-over { box-shadow: 0 -2px 0 0 var(--accent); }

/* ═══════════════════════════════════════════════════════════════
   THEMES — applied via JS inline styles for flexibility
   We define dark & light card styles per theme in JS.
   ═══════════════════════════════════════════════════════════════ */

/* CRT scanlines overlay */
.crt-scanlines::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
  pointer-events: none;
  border-radius: 12px;
}

/* ═══════════════════════════════════════════════════════════════
   BOTTOM BAR
   ═══════════════════════════════════════════════════════════════ */
.bottom-bar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  height: 52px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  padding: 0 16px;
  z-index: 50;
  animation: slideUp 0.4s var(--ease-out) 0.15s both;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(6px) } }

.bar-logo {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--text-2);
  letter-spacing: -0.03em;
  user-select: none;
  padding: 0 12px 0 4px;
}
.bar-logo b { color: var(--accent); font-weight: 800; }
.bar-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

.bar-group { display: flex; flex-direction: column; gap: 1px; padding: 0 14px; }
.bar-label { font-size: 10.5px; font-weight: 600; color: var(--text-3); letter-spacing: 0.02em; line-height: 1; }
.bar-value { display: flex; align-items: center; gap: 6px; min-height: 22px; }

/* Toggle */
.toggle { position: relative; width: 28px; height: 16px; cursor: pointer; display: inline-block; flex-shrink: 0; }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle .track { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 999px; transition: background 0.2s var(--ease-out); }
.toggle .knob { position: absolute; width: 10px; height: 10px; top: 3px; left: 3px; background: rgba(255,255,255,0.5); border-radius: 50%; transition: transform 0.2s var(--ease-spring), background 0.2s; pointer-events: none; }
.toggle input:checked + .track { background: #56c2fe; }
.toggle input:checked + .track + .knob { transform: translateX(12px); background: #fff; }

/* Theme trigger */
.theme-trigger { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; padding: 2px 0; font-family: inherit; }
.theme-trigger:hover .theme-swatch { transform: scale(1.15); }
.theme-swatch { width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; transition: transform 0.2s var(--ease-spring); box-shadow: 0 0 0 1px rgba(255,255,255,0.1); }
.theme-trigger svg { color: var(--text-4); transition: color 0.15s; }
.theme-trigger:hover svg { color: var(--text-3); }

/* Theme dropdown */
.theme-dd {
  position: fixed;
  bottom: 58px;
  background: #1e1e1e;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 4px;
  min-width: 190px;
  z-index: 200;
  box-shadow: 0 16px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  opacity: 0;
  transform: translateY(6px) scale(0.97);
  pointer-events: none;
  transition: all 0.2s var(--ease-out);
}
.theme-dd.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.theme-dd .dd-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-4); padding: 10px 12px 6px; }
.theme-dd .dd-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-2); transition: background 0.12s, color 0.12s; }
.theme-dd .dd-item:hover { background: rgba(255,255,255,0.05); color: var(--text-1); }
.theme-dd .dd-item.active { background: rgba(255,255,255,0.07); color: var(--text-1); }
.dd-swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }

/* Padding buttons */
.pad-btns { display: flex; gap: 1px; background: rgba(255,255,255,0.04); border-radius: 6px; padding: 1px; }
.pad-btns button { background: none; border: none; color: var(--text-3); padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.15s; }
.pad-btns button:hover { color: var(--text-2); }
.pad-btns button.on { color: var(--text-1); background: rgba(255,255,255,0.08); }

/* AI Label — editable dropdown */
.ai-label-wrap { position: relative; }
.ai-label-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-2);
  padding: 2px 6px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.ai-label-btn:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.02); }
.ai-label-btn svg { color: var(--text-4); flex-shrink: 0; }

.ai-dd {
  position: fixed;
  bottom: 58px;
  background: #1e1e1e;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 4px;
  min-width: 200px;
  z-index: 200;
  box-shadow: 0 16px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  opacity: 0;
  transform: translateY(6px) scale(0.97);
  pointer-events: none;
  transition: all 0.2s var(--ease-out);
}
.ai-dd.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.ai-dd .dd-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-4); padding: 10px 12px 6px; }
.ai-dd .dd-preset {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-2);
  font-family: 'JetBrains Mono', monospace; transition: background 0.12s, color 0.12s;
}
.ai-dd .dd-preset:hover { background: rgba(255,255,255,0.05); color: var(--text-1); }
.ai-dd .dd-preset.active { background: rgba(255,255,255,0.07); color: var(--text-1); }
.ai-dd .dd-preset .preset-icon { font-size: 14px; width: 20px; text-align: center; }
.ai-dd .dd-custom-wrap {
  padding: 6px 8px;
  border-top: 1px solid rgba(255,255,255,0.06);
  margin-top: 4px;
}
.ai-dd .dd-custom-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  color: var(--text-1);
  padding: 6px 10px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  outline: none;
  transition: border-color 0.15s;
}
.ai-dd .dd-custom-input:focus { border-color: rgba(255,255,255,0.2); }
.ai-dd .dd-custom-input::placeholder { color: var(--text-4); }

.bar-spacer { flex: 1; }

/* Export button */
.export-grp {
  display: flex;
  align-items: stretch;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.3);
  transition: box-shadow 0.2s, border-color 0.2s;
}
.export-grp:hover {
  box-shadow: 0 0 20px hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.12);
}
.export-grp button {
  background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.1);
  color: hsl(var(--accent-h), var(--accent-s), var(--accent-l));
  border: none;
  font-family: 'Manrope', sans-serif;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: background 0.15s;
}
.export-grp button:hover { background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.18); }
.export-grp .x-main { padding: 8px 16px; border-right: 1px solid hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.25); }
.export-grp .x-copy { padding: 8px 10px; }

.kbd { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--text-4); margin-left: 6px; font-weight: 500; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }

/* Toast */
.toast {
  position: fixed; bottom: 68px; left: 50%;
  display: flex; align-items: center; gap: 8px;
  background: #2a2a2a; color: var(--text-1); padding: 10px 18px;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
  z-index: 300; opacity: 0; transform: translateX(-50%) translateY(8px);
  pointer-events: none; transition: all 0.3s var(--ease-out);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { color: #4ade80; flex-shrink: 0; }
</style>
</head>
<body>

<div class="app">
  <div class="editor-panel">
    <div class="panel-hdr"><span>Editor</span><span class="hint">&gt;/&rsaquo; user &middot; text = ai &middot; blank = gap</span></div>
    <textarea id="editor" spellcheck="false" placeholder="> ask me anything&#10;I'd be happy to help!"></textarea>
  </div>

  <div class="preview-panel">
    <div class="panel-hdr"><span>Preview</span></div>
    <div class="preview-scroll" id="previewScroll">
      <div id="exportTarget" style="display:inline-block">
        <div class="export-frame has-bg" id="exportFrame">
          <div class="terminal" id="terminal">
            <div class="terminal-chrome">
              <div class="chrome-dots"><span></span><span></span><span></span></div>
              <span class="chrome-title" id="chromeTitle">dumbot</span>
            </div>
            <div class="terminal-body" id="termBody"></div>
          </div>
          <div class="resize-handle left" id="resL"></div>
          <div class="resize-handle right" id="resR"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bar-logo">dum<b>bot</b></div>
    <div class="bar-sep"></div>

    <div class="bar-group">
      <span class="bar-label">Theme</span>
      <div class="bar-value" style="position:relative">
        <button class="theme-trigger" id="themeBtn">
          <span class="theme-swatch" id="themeSwatch"></span>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2.5 6L5 3.5L7.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="theme-dd" id="themeDd"></div>
      </div>
    </div>

    <div class="bar-group">
      <span class="bar-label">Background</span>
      <div class="bar-value"><label class="toggle"><input type="checkbox" id="bgToggle" checked><span class="track"></span><span class="knob"></span></label></div>
    </div>

    <div class="bar-group">
      <span class="bar-label">Dark mode</span>
      <div class="bar-value"><label class="toggle"><input type="checkbox" id="darkToggle" checked><span class="track"></span><span class="knob"></span></label></div>
    </div>

    <div class="bar-group">
      <span class="bar-label">Turn #s</span>
      <div class="bar-value"><label class="toggle"><input type="checkbox" id="numToggle"><span class="track"></span><span class="knob"></span></label></div>
    </div>

    <div class="bar-group">
      <span class="bar-label">Padding</span>
      <div class="bar-value">
        <div class="pad-btns" id="padBtns">
          <button data-v="16">16</button>
          <button data-v="32">32</button>
          <button data-v="64" class="on">64</button>
          <button data-v="128">128</button>
        </div>
      </div>
    </div>

    <div class="bar-group">
      <span class="bar-label">AI Label</span>
      <div class="bar-value">
        <div class="ai-label-wrap" id="aiLabelWrap">
          <button class="ai-label-btn" id="aiLabelBtn">
            <span id="aiLabelText">claude</span>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2.5 6L5 3.5L7.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="ai-dd" id="aiDd"></div>
        </div>
      </div>
    </div>

    <div class="bar-spacer"></div>

    <div class="export-grp">

// ─── Parser ──────────────────────────────────────────────────
// Bullet chars used by CLI tools — stripped from AI text so we can add our own styled prefix
const BULLET_RE = /^[•●◆▸►‣⦿]\s*/;
// Prompt chars: > (standard) and › (Codex CLI uses right guillemet)
function isUserLine(ln) { return ln.startsWith('> ') || ln === '>' || ln.startsWith('\u203A ') || ln === '\u203A'; }
function stripUserPrompt(ln) { return ln.replace(/^[>\u203A]\s?/, ''); }

function parse(text) {
  const lines = text.split('\n'), turns = [];
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (!ln.trim()) {
      // Blank line: only split turns if next non-blank line is a user prompt
      // Otherwise treat as paragraph gap within AI response
      if (cur?.type === 'user') { turns.push(cur); cur = null; turns.push({type:'gap'}); }
      else if (cur?.type === 'ai') {
        // Look ahead: if next content is a user line or another bullet, start new turn
        let j = i + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        const next = lines[j];
        if (!next || isUserLine(next) || BULLET_RE.test(next)) {
          turns.push(cur); cur = null; turns.push({type:'gap'});
        } else {
          // Blank within AI response — push a gap marker into the lines for spacing
          cur.lines.push('');
        }
      } else {
        turns.push({type:'gap'});
      }
    }
    else if (isUserLine(ln)) { if (cur) turns.push(cur); cur = {type:'user', text: stripUserPrompt(ln)}; }
    else { if (cur?.type==='ai') cur.lines.push(ln); else { if (cur) turns.push(cur); cur = {type:'ai',lines:[ln]}; }}
  }
  if (cur) turns.push(cur);
  while (turns.at(-1)?.type==='gap') turns.pop();
  while (turns[0]?.type==='gap') turns.shift();
  const out = [];
  for (const t of turns) { if (t.type==='gap' && out.at(-1)?.type==='gap') continue; out.push(t); }
  return out;
}

// ─── Render ──────────────────────────────────────────────────
function render() {
  const turns = parse($('editor').value);
  const tb = $('termBody');
  if (!turns.length) { tb.innerHTML = '<div class="empty-state">paste a conversation above...</div>'; return; }

  const label = aiLabel || 'ai';
  const nums = $('numToggle').checked;
  const ps = getActivePresetStyle();
  let h = '', n = 0, lastU = -1;
  for (let i = turns.length-1; i >= 0; i--) if (turns[i].type==='user') { lastU = i; break; }
  let eLine = 0;
  const eLines = $('editor').value.split('\n');

  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    if (t.type==='gap') { h += '<div class="turn-gap"></div>'; while (eLine < eLines.length && !eLines[eLine].trim()) eLine++; continue; }
    n++;
    const nm = `<span class="turn-number ${nums?'':'hidden'}">${n}</span>`;
    const ln = eLine;
    if (t.type==='user') {
      const c = i===lastU ? ' cursor-blink' : '';
      const barCls = ps.promptStyle === 'bar' ? ' prompt-bar' : ps.promptStyle === 'accent' ? ' prompt-accent' : '';
      h += `<div class="turn turn-user${c}${barCls}" data-ln="${ln}" draggable="true" data-i="${i}">${nm}<span class="prompt-char">&gt;</span> <span class="user-text">${esc(t.text)}</span></div>`;
      eLine++;
    } else {
      const contCls = ps.continuation === 'none' ? ' cont-none' : ps.continuation === 'indent' ? ' cont-indent' : '';
      h += `<div class="turn turn-ai${contCls}" data-ln="${ln}" draggable="true" data-i="${i}">${nm}`;
      // Check if first line has a bullet char — strip it and add our styled one
      const firstLine = t.lines[0] || '';
      const hasBullet = BULLET_RE.test(firstLine);
      if (ps.aiPrefix === 'bullet' && hasBullet) {
        h += `<span class="ai-bullet">&#9679;</span>`;
      } else if (ps.aiPrefix === 'label') {
        h += `<span class="ai-prefix">${esc(label)}</span>`;
      }
      t.lines.forEach((l,j) => {
        if (!l && j > 0) { h += '<div class="ai-para-gap"></div>'; return; }
        const text = j === 0 && hasBullet ? l.replace(BULLET_RE, '') : l;
        h += j===0 ? `<span>${highlight(text)}</span>` : `<span class="continuation">${highlight(text)}</span>`;
      });
      h += '</div>';
      eLine += t.lines.length;
    }
  }
  tb.innerHTML = h;
  applyTurnColors();
  bindTurns();
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── Inline Syntax Highlighting ─────────────────────────────
// Highlights CLI tokens: /commands, `backtick code`, **bold**, paths, list numbers
// Uses placeholder approach to avoid regex conflicts with generated HTML
function highlight(text) {
  const tokens = [];
  let s = text;
  // Phase 1: extract tokens that need special rendering (replace with placeholders)
  // `backtick code`
  s = s.replace(/`([^`]+)`/g, (_, inner) => { tokens.push(`<span class="hl-cmd">${esc(inner)}</span>`); return `\x00${tokens.length - 1}\x00`; });
  // **bold**
  s = s.replace(/\*\*([^*]+)\*\*/g, (_, inner) => { tokens.push(`<strong>${esc(inner)}</strong>`); return `\x00${tokens.length - 1}\x00`; });
  // Now escape the remaining plain text
  s = esc(s);
  // Phase 2: highlight patterns in the escaped text (safe — no HTML to corrupt)
  // /slash-commands and /paths (e.g. /ce:compound, src/digest/strategies.ts)
  s = s.replace(/(?<![&\w])(\/?(?:[\w@.~-]+\/)+[\w@.~-]*|\/[\w:.-]+)/g, '<span class="hl-cmd">$1</span>');
  // List numbers at line start: "1. ", "2. " etc
  s = s.replace(/^(\s*\d+\.)\s/gm, '<span class="hl-num">$1</span> ');
  // Phase 3: restore token placeholders
  s = s.replace(/\x00(\d+)\x00/g, (_, i) => tokens[+i]);
  return s;
}

function bindTurns() {
  $('termBody').querySelectorAll('.turn[data-ln]').forEach(el => {
    el.addEventListener('click', () => {
      const ln = +el.dataset.ln, lines = $('editor').value.split('\n');
      let p = 0; for (let i = 0; i < ln; i++) p += lines[i].length + 1;
      $('editor').focus(); $('editor').setSelectionRange(p, p + (lines[ln]||'').length);
    });
    el.addEventListener('dragstart', function(e) { this.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', this.dataset.i); });
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('dragenter', function() { this.classList.add('drag-over'); });
    el.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    el.addEventListener('dragend', function() { this.classList.remove('dragging'); $('termBody').querySelectorAll('.turn').forEach(t=>t.classList.remove('drag-over')); });
    el.addEventListener('drop', function(e) {
      e.preventDefault(); this.classList.remove('drag-over');
      const si = e.dataTransfer.getData('text/plain'), se = $('termBody').querySelector(`[data-i="${si}"]`);
      if (!se || se===this) return;
      const sl = +se.dataset.ln, dl = +this.dataset.ln, lines = $('editor').value.split('\n');
      const sb = blk(lines,sl), st = sb.map(i=>lines[i]).join('\n');
      for (let i=sb.length-1;i>=0;i--) lines.splice(sb[i],1);
      let d = dl>sl ? dl-sb.length : dl;
      st.split('\n').reverse().forEach(l=>lines.splice(d,0,l));
      $('editor').value = lines.join('\n'); render();
    });
  });
}
function blk(lines,s) { const r=[s]; if (lines[s]?.startsWith('> ')) return r; for (let i=s+1;i<lines.length;i++) { if (!lines[i].trim()||lines[i].startsWith('> ')) break; r.push(i); } return r; }

$('padBtns').querySelectorAll('button').forEach(b => {

    $('padBtns').querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.documentElement.style.setProperty('--terminal-padding', b.dataset.v + 'px');
  });
});

// Resize
function initResize(e, dir) {
  const sx = e.clientX, sw = $('terminal').offsetWidth;
  document.body.style.cursor = 'ew-resize'; document.body.style.userSelect = 'none';
  const mv = e => { const dx = (e.clientX-sx)*(dir==='left'?-2:2); document.documentElement.style.setProperty('--terminal-width', Math.max(300,Math.min(900,sw+dx))+'px'); };
  const up = () => { document.body.style.cursor=''; document.body.style.userSelect=''; document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
}
$('resL').addEventListener('mousedown', e => initResize(e,'left'));
$('resR').addEventListener('mousedown', e => initResize(e,'right'));

// Export
async function exportPng(copy) {
  const handles = $('exportFrame').querySelectorAll('.resize-handle');
  handles.forEach(h => h.style.display='none');
  const blink = $('terminal').querySelector('.cursor-blink');
  if (blink) blink.classList.remove('cursor-blink');
  try {
    const n = $('exportTarget'), s = 3;
    const url = await domtoimage.toPng(n, {
      width: n.offsetWidth*s, height: n.offsetHeight*s,
      style: { transform:`scale(${s})`, transformOrigin:'top left', width:n.offsetWidth+'px', height:n.offsetHeight+'px' },
      bgcolor: $('bgToggle').checked ? undefined : 'transparent',
    });
    if (copy) { const blob = await (await fetch(url)).blob(); await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); toast('Copied to clipboard'); }
    else { Object.assign(document.createElement('a'), {download:'dumbot.png',href:url}).click(); toast('Image exported'); }
  } catch(err) { console.error(err); toast('Export failed'); }
  handles.forEach(h => h.style.display='');
  if (blink) blink.classList.add('cursor-blink');
}
function toast(msg) { $('toastMsg').textContent=msg; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),2200); }

$('exportBtn').addEventListener('click', ()=>exportPng(false));
$('copyBtn').addEventListener('click', ()=>exportPng(true));
document.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey)&&e.key==='s') { e.preventDefault(); exportPng(false); }});
